Sans Mono', 'Courier New', monospace" xml:space="preserve">01</text><rect x="56" y="186" width="300" height="250" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="56" y="186" width="4" height="250" fill="#d8b25e"/><text x="76" y="216" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">BROWSER / SPA CONSOLE</text><line x1="72" y1="230" x2="340" y2="230" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="78" y="246" fill="#d5e0ea" font-size="15" font-weight="600" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Single-page console</text><text x="78" y="272" fill="#8093a6" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">public/index.html · public/js/app.js</text><line x1="78" y1="288" x2="334" y2="288" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><rect x="78" y="308" width="5" height="5" fill="#d8b25e"/><text x="92" y="316" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Bearer token kept in memory</text><rect x="78" y="336" width="5" height="5" fill="#d8b25e"/><text x="92" y="344" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">No cookie, no stored password</text><rect x="78" y="364" width="5" height="5" fill="#d8b25e"/><text x="92" y="372" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Same UI for admin and member</text><rect x="78" y="392" width="5" height="5" fill="#d8b25e"/><text x="92" y="400" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Works fully on loopback</text><text x="78" y="424" fill="#4f6275" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">Any modern Chromium, Firefox or Safari</text><line x1="360" y1="300" x2="492" y2="300" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><polygon points="492.0,300.0 481.0,295.4 481.0,304.6" fill="#d8b25e"/><text x="366" y="284" fill="#d8b25e" font-size="12" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">HTTP / JSON</text><text x="366" y="322" fill="#8093a6" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">127.0.0.1:7373</text><rect x="500" y="178" width="390" height="266" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="500" y="178" width="4" height="266" fill="#d8b25e"/><text x="520" y="208" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">NODE.JS SERVER · server.js</text><line x1="516" y1="222" x2="874" y2="222" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="524" y="234" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">01  Route match + body read</text><text x="524" y="261" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">02  Bearer token + session age</text><text x="524" y="288" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">03  Role gate: admin / user</text><text x="524" y="315" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">04  Ownership gate per path</text><text x="524" y="342" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">05  safeJoin rejects every '..'</text><text x="524" y="369" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">06  Ledger row on each change</text><text x="524" y="414" fill="#8fd6e8" font-size="12" font-weight="600" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">Binds 127.0.0.1 · port 7373</text><text x="524" y="434" fill="#4f6275" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">Node.js 18+ · no runtime dependencies</text><line x1="894" y1="300" x2="1024" y2="300" stroke="#6fcf9f" stroke-width="2" stroke-linecap="butt"/><polygon points="1024.0,300.0 1013.0,295.4 1013.0,304.6" fill="#6fcf9f"/><text x="900" y="284" fill="#6fcf9f" font-size="12" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">fs read / write</text><text x="900" y="322" fill="#8093a6" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">ciphertext only</text><rect x="1032" y="186" width="334" height="250" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="1032" y="186" width="4" height="250" fill="#8fd6e8"/><text x="1052" y="216" fill="#8fd6e8" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">SEALED STORAGE · data/</text><line x1="1048" y1="230" x2="1350" y2="230" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="1054" y="232" fill="#d5e0ea" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">install.salt</text><text x="1054" y="256" fill="#d5e0ea" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">auth.json</text><text x="1054" y="280" fill="#d5e0ea" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">system.db</text><text x="1054" y="304" fill="#d5e0ea" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">users/&lt;sha256&gt;.db</text><text x="1054" y="328" fill="#d5e0ea" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">files/users/&lt;workspace&gt;/</text><text x="1054" y="352" fill="#d5e0ea" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">tunnel.url</text><text x="1054" y="396" fill="#8fd6e8" font-size="12" font-weight="600" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">AES-256-GCM envelopes on disk</text><text x="1054" y="416" fill="#4f6275" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">Keys derived on this machine</text><g transform="translate(1462 186)"><rect x="0" y="0" width="82" height="250" fill="#0a121b" stroke="#31465b" stroke-width="1.2" stroke-dasharray="4 5"/><text x="41" y="132" fill="#d8b25e" font-size="18" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="3">ONE</text><text x="41" y="156" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="1.5">LISTENER</text><line x1="24" y1="172" x2="58" y2="172" stroke="#31465b" stroke-width="1" stroke-linecap="butt"/><text x="41" y="196" fill="#4f6275" font-size="10" font-weight="600" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">NO OTHER</text><text x="41" y="212" fill="#4f6275" font-size="10" font-weight="600" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">INBOUND PORT</text></g><rect x="56" y="490" width="716" height="336" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="56" y="490" width="4" height="336" fill="#d8b25e"/><text x="76" y="520" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">INBOUND PATH 01 · DIRECT LOOPBACK</text><text x="754" y="520" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">A</text><line x1="72" y1="534" x2="756" y2="534" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="80" y="552" fill="#8fd6e8" font-size="25" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="1">127.0.0.1:7373</text><text x="80" y="578" fill="#8093a6" font-size="13" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">http://127.0.0.1:7373</text><line x1="80" y1="598" x2="748" y2="598" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><rect x="80" y="624" width="5" height="5" fill="#d8b25e"/><text x="94" y="632" fill="#d5e0ea" font-size="13.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Only a browser on this machine can connect.</text><rect x="80" y="654" width="5" height="5" fill="#d8b25e"/><text x="94" y="662" fill="#d5e0ea" font-size="13.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Default bind address 127.0.0.1 · default port 7373.</text><rect x="80" y="684" width="5" height="5" fill="#d8b25e"/><text x="94" y="692" fill="#d5e0ea" font-size="13.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">No router forwarding, public IP or DNS record.</text><rect x="80" y="714" width="5" height="5" fill="#d8b25e"/><text x="94" y="722" fill="#d5e0ea" font-size="13.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">TS_BIND=0.0.0.0 widens the bind, but traffic is then plain HTTP.</text><rect x="80" y="744" width="5" height="5" fill="#d8b25e"/><text x="94" y="752" fill="#d5e0ea" font-size="13.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Recommendation: keep loopback unless a tunnel is the only path.</text><rect x="80" y="768" width="668" height="35" fill="#060b11" stroke="#22303f" stroke-width="1"/><text x="92" y="786" fill="#8fd6e8" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">TS_BIND=0.0.0.0 node server.js</text><text x="80" y="818" fill="#4f6275" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">Only do this on a trusted network; the session token is then exposed.</text><rect x="816" y="490" width="728" height="336" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="816" y="490" width="4" height="336" fill="#d8b25e"/><text x="836" y="520" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">INBOUND PATH 02 · OUTBOUND TUNNEL</text><text x="1526" y="520" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">B</text><line x1="832" y1="534" x2="1528" y2="534" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><rect x="840" y="528" width="110" height="46" fill="#0a121b" stroke="#d8b25e" stroke-width="1.3"/><text x="895.0" y="556" fill="#d8b25e" font-size="12.5" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">ADMIN</text><rect x="994" y="528" width="132" height="46" fill="#0a121b" stroke="#8fd6e8" stroke-width="1.3"/><text x="1060.0" y="556" fill="#8fd6e8" font-size="12.5" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">cloudflared</text><rect x="1160" y="528" width="132" height="46" fill="#0a121b" stroke="#8fd6e8" stroke-width="1.3"/><text x="1226.0" y="556" fill="#8fd6e8" font-size="12.5" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">CLOUDFLARE</text><rect x="1326" y="528" width="100" height="46" fill="#0a121b" stroke="#6fcf9f" stroke-width="1.3"/><text x="1376.0" y="556" fill="#6fcf9f" font-size="12.5" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">VIEWER</text><line x1="950" y1="551" x2="994" y2="551" stroke="#31465b" stroke-width="2" stroke-linecap="butt"/><polygon points="994.0,551.0 983.0,546.4 983.0,555.6" fill="#31465b"/><line x1="1116" y1="551" x2="1160" y2="551" stroke="#31465b" stroke-width="2" stroke-linecap="butt"/><polygon points="1160.0,551.0 1149.0,546.4 1149.0,555.6" fill="#31465b"/><line x1="1286" y1="551" x2="1326" y2="551" stroke="#31465b" stroke-width="2" stroke-linecap="butt"/><polygon points="1326.0,551.0 1315.0,546.4 1315.0,555.6" fill="#31465b"/><rect x="840" y="600" width="680" height="56" fill="#060b11" stroke="#22303f" stroke-width="1"/><text x="852" y="618" fill="#8fd6e8" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">cloudflared tunnel --protocol http2 --edge-ip-version 4 \</text><text x="852" y="639" fill="#8fd6e8" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">  --url http://127.0.0.1:7373</text><rect x="840" y="692" width="5" height="5" fill="#8fd6e8"/><text x="854" y="700" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">cloudflared dials out; no inbound port opens.</text><rect x="840" y="720" width="5" height="5" fill="#8fd6e8"/><text x="854" y="728" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Cloudflare allocates the HTTPS hostname at runtime.</text><rect x="840" y="748" width="5" height="5" fill="#8fd6e8"/><text x="854" y="756" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">The login page publishes it read-only with a copy button.</text><rect x="840" y="776" width="5" height="5" fill="#8fd6e8"/><text x="854" y="784" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">A Quick Tunnel hostname dies with the process.</text><text x="840" y="802" fill="#4f6275" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">run-online.sh wraps the same command and prints the hostname.</text><line x1="56" y1="834" x2="1544" y2="834" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="56" y="856" fill="#d8b25e" font-size="11" font-weight="600" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="1.5">TENSAINT73OS · THE SAINT KEY PROTOCOL</text><text x="1544" y="856" fill="#4f6275" font-size="11" font-weight="600" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="1.5">SHEET 01 / 07 · V1.5.0</text></svg>