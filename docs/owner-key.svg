</defs><rect x="0" y="0" width="1600" height="850" fill="#05080d" stroke="#05080d" stroke-width="0"/><rect x="0" y="0" width="1600" height="850" fill="url(#grid)" opacity="0.55"/><line x1="28" y1="28" x2="54" y2="28" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="28" y1="28" x2="28" y2="54" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="1572" y1="28" x2="1546" y2="28" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="1572" y1="28" x2="1572" y2="54" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="28" y1="822" x2="54" y2="822" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="28" y1="822" x2="28" y2="796" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="1572" y1="822" x2="1546" y2="822" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="1572" y1="822" x2="1572" y2="796" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="56" y1="148" x2="1544" y2="148" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><line x1="56" y1="148" x2="286" y2="148" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><text x="56" y="58" fill="#d8b25e" font-size="12.5" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2.5">TENSAINT73OS  //  DOC SHEET 04</text><text x="56" y="104" fill="#eef3f8" font-size="33" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve" letter-spacing="0.6">OWNER KEY / PORTABLE ADMIN IDENTITY</text><text x="56" y="134" fill="#8093a6" font-size="15.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Export the encrypted identity, register its fingerprint, import on any device.</text><text x="1544" y="116" fill="#121c27" font-size="74" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">04</text><rect x="56" y="186" width="430" height="344" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="56" y="186" width="4" height="344" fill="#d8b25e"/><text x="76" y="216" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">01 · EXPORT ON THE ORIGINAL HOST</text><line x1="72" y1="230" x2="470" y2="230" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="80" y="248" fill="#d5e0ea" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Stop the server completely.</text><text x="80" y="274" fill="#8093a6" font-size="11.5" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="1">Windows</text><rect x="80" y="284" width="382" height="35" fill="#060b11" stroke="#22303f" stroke-width="1"/><text x="92" y="302" fill="#d8b25e" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">owner\Export-Owner-Key.bat</text><text x="80" y="350" fill="#8093a6" font-size="11.5" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="1">Linux / Termux / iSH</text><rect x="80" y="360" width="382" height="35" fill="#060b11" stroke="#22303f" stroke-width="1"/><text x="92" y="378" fill="#d8b25e" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">sh owner/export-owner-key.sh</text><line x1="80" y1="412" x2="462" y2="412" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><rect x="80" y="434" width="5" height="5" fill="#d8b25e"/><text x="94" y="442" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">admin name and password</text><rect x="80" y="458" width="5" height="5" fill="#d8b25e"/><text x="94" y="466" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">bound phone, when one exists</text><rect x="80" y="482" width="5" height="5" fill="#d8b25e"/><text x="94" y="490" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">new passphrase, 8+ characters, twice</text><rect x="516" y="186" width="568" height="344" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="516" y="186" width="4" height="344" fill="#8fd6e8"/><text x="536" y="216" fill="#8fd6e8" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">02 · THE .tsowner ENVELOPE</text><text x="1066" y="216" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">B</text><line x1="532" y1="230" x2="1068" y2="230" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><rect x="540" y="248" width="520" height="72" fill="#070d14" stroke="#8fd6e8" stroke-width="1.5"/><text x="556" y="276" fill="#8fd6e8" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">magic · format 1 · kdf scrypt · cipher aes-256-gcm</text><text x="556" y="300" fill="#8093a6" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">scrypt(N=16384, r=8, p=1) · fresh salt and iv</text><rect x="540" y="332" width="520" height="88" fill="#0a121b" stroke="#31465b" stroke-width="1.2"/><text x="556" y="372" fill="#d5e0ea" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">salt</text><text x="556" y="394" fill="#4f6275" font-size="10.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">random</text><text x="682" y="372" fill="#d5e0ea" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">iv</text><text x="682" y="394" fill="#4f6275" font-size="10.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">random</text><text x="808" y="372" fill="#d5e0ea" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">tag</text><text x="808" y="394" fill="#4f6275" font-size="10.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">random</text><text x="934" y="372" fill="#d5e0ea" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">ciphertext (base64)</text><text x="934" y="394" fill="#4f6275" font-size="10.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">random</text><text x="540" y="450" fill="#d5e0ea" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">Payload: username · password hash · role · salt · createdAt · phone</text><text x="540" y="476" fill="#d8b25e" font-size="12.5" font-weight="600" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">No plaintext identity exists outside the envelope.</text><text x="540" y="504" fill="#8093a6" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">File and passphrase stay in different places.</text><rect x="1114" y="186" width="430" height="344" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="1114" y="186" width="4" height="344" fill="#6fcf9f"/><text x="1134" y="216" fill="#6fcf9f" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">03 · IMPORT ON THE NEW HOST</text><line x1="1130" y1="230" x2="1528" y2="230" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="1138" y="248" fill="#d5e0ea" font-size="13.5" font-weight="600" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Fresh install; the pin names the one key it accepts.</text><text x="1138" y="274" fill="#8093a6" font-size="11.5" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="1">Windows</text><rect x="1138" y="284" width="382" height="35" fill="#060b11" stroke="#22303f" stroke-width="1"/><text x="1150" y="302" fill="#6fcf9f" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">owner\Import-Owner-Key.bat</text><text x="1138" y="350" fill="#8093a6" font-size="11.5" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="1">Linux / Termux / iSH</text><rect x="1138" y="360" width="382" height="35" fill="#060b11" stroke="#22303f" stroke-width="1"/><text x="1150" y="378" fill="#6fcf9f" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">sh owner/import-owner-key.sh</text><text x="1138" y="426" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Only the key matching owner/OWNER.pin is accepted.</text><text x="1138" y="452" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Sign in with the original password plus</text><text x="1138" y="474" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">the bound phone number, if one is bound.</text><text x="1138" y="504" fill="#6fcf9f" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">Phone re-encrypted with the new install salt.</text><rect x="56" y="558" width="728" height="250" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="56" y="558" width="4" height="250" fill="#e58173"/><text x="76" y="588" fill="#e58173" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">IMPORT RULES</text><text x="766" y="588" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">C</text><line x1="72" y1="602" x2="768" y2="602" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><rect x="80" y="618" width="5" height="5" fill="#e58173"/><text x="94" y="626" fill="#d5e0ea" font-size="12.8" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Refused unless the key matches owner/OWNER.pin.</text><rect x="80" y="644" width="5" height="5" fill="#e58173"/><text x="94" y="652" fill="#d5e0ea" font-size="12.8" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Refused on a username collision with a member.</text><rect x="80" y="670" width="5" height="5" fill="#e58173"/><text x="94" y="678" fill="#d5e0ea" font-size="12.8" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Refused when an administrator already exists.</text><rect x="80" y="696" width="5" height="5" fill="#e58173"/><text x="94" y="704" fill="#d5e0ea" font-size="12.8" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">The phone record is re-encrypted for this install.</text><rect x="80" y="722" width="5" height="5" fill="#e58173"/><text x="94" y="730" fill="#d5e0ea" font-size="12.8" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Only the identity moves; the old data stays.</text><rect x="80" y="748" width="5" height="5" fill="#e58173"/><text x="94" y="756" fill="#d5e0ea" font-size="12.8" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">The tool never contacts the network.</text><rect x="80" y="774" width="5" height="5" fill="#e58173"/><text x="94" y="782" fill="#d5e0ea" font-size="12.8" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Forgetting the passphrase means re-exporting.</text><rect x="808" y="558" width="736" height="250" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="808" y="558" width="4" height="250" fill="#d8b25e"/><text x="828" y="588" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">IDENTITY VS DATA</text><text x="1526" y="588" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">D</text><line x1="824" y1="602" x2="1528" y2="602" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><rect x="832" y="602" width="5" height="5" fill="#d8b25e"/><text x="846" y="610" fill="#d5e0ea" font-size="12.8" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">The key restores the administrator account only.</text><rect x="832" y="629" width="5" height="5" fill="#d8b25e"/><text x="846" y="637" fill="#d5e0ea" font-size="12.8" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Member accounts and private vaults do not move.</text><rect x="832" y="656" width="5" height="5" fill="#d8b25e"/><text x="846" y="664" fill="#d5e0ea" font-size="12.8" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Each device keeps an independent data set.</text><rect x="832" y="683" width="5" height="5" fill="#d8b25e"/><text x="846" y="691" fill="#d5e0ea" font-size="12.8" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Moving data means copying the whole data/ folder with</text><rect x="832" y="710" width="5" height="5" fill="#d8b25e"/><text x="846" y="718" fill="#d5e0ea" font-size="12.8" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">install.salt, auth.json and system.db together.</text><rect x="832" y="737" width="5" height="5" fill="#d8b25e"/><text x="846" y="745" fill="#d5e0ea" font-size="12.8" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">There is no automatic sync between installations.</text><text x="832" y="786" fill="#8093a6" font-size="12" font-weight="600" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">.tsowner is not a backup of files or tables.</text><line x1="56" y1="804" x2="1544" y2="804" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="56" y="826" fill="#d8b25e" font-size="11" font-weight="600" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="1.5">TENSAINT73OS · THE SAINT KEY PROTOCOL</text><text x="1544" y="826" fill="#4f6275" font-size="11" font-weight="600" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="1.5">SHEET 04 / 07 · V1.5.0</text></svg>