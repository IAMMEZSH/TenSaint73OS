<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0d1622" stroke-width="1"/>
</pattern>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <line x1="0" y1="0" x2="0" y2="8" stroke="#1b2a3a" stroke-width="2"/>
</pattern>
</defs><rect x="0" y="0" width="1600" height="880" fill="#05080d" stroke="#05080d" stroke-width="0"/><rect x="0" y="0" width="1600" height="880" fill="url(#grid)" opacity="0.55"/><line x1="28" y1="28" x2="54" y2="28" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="28" y1="28" x2="28" y2="54" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="1572" y1="28" x2="1546" y2="28" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="1572" y1="28" x2="1572" y2="54" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="28" y1="852" x2="54" y2="852" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="28" y1="852" x2="28" y2="826" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="1572" y1="852" x2="1546" y2="852" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="1572" y1="852" x2="1572" y2="826" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="56" y1="148" x2="1544" y2="148" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><line x1="56" y1="148" x2="286" y2="148" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><text x="56" y="58" fill="#d8b25e" font-size="12.5" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2.5">TENSAINT73OS  //  DOC SHEET 02</text><text x="56" y="104" fill="#eef3f8" font-size="33" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve" letter-spacing="0.6">PER-MEMBER ISOLATION / ADMIN BOUNDARY</text><text x="56" y="134" fill="#8093a6" font-size="15.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">One vault and one workspace per member. The supreme admin cannot cross that line.</text><text x="1544" y="116" fill="#121c27" font-size="74" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">02</text><rect x="56" y="186" width="456" height="320" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="56" y="186" width="4" height="320" fill="#d8b25e"/><text x="76" y="216" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">MEMBER · alice</text><text x="494" y="216" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">01</text><line x1="72" y1="230" x2="496" y2="230" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="80" y="246" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">GET  /api/my</text><text x="80" y="273" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">GET  /api/db/tables</text><text x="80" y="300" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">GET  /api/fs/list</text><text x="80" y="327" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">POST /api/me/password</text><text x="80" y="354" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">POST /api/me/delete</text><text x="80" y="398" fill="#8093a6" font-size="13" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Routes resolve to alice's own root only.</text><line x1="80" y1="418" x2="488" y2="418" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="80" y="446" fill="#8fd6e8" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">data/users/&lt;sha256(alice)&gt;.db</text><text x="80" y="470" fill="#8fd6e8" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">data/files/users/alice-…/</text><rect x="532" y="186" width="456" height="320" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="532" y="186" width="4" height="320" fill="#d8b25e"/><text x="552" y="216" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">MEMBER · bob</text><text x="970" y="216" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">02</text><line x1="548" y1="230" x2="972" y2="230" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><rect x="556" y="242" width="5" height="5" fill="#d8b25e"/><text x="570" y="250" fill="#d5e0ea" font-size="13.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Same route table</text><rect x="556" y="269" width="5" height="5" fill="#d8b25e"/><text x="570" y="277" fill="#d5e0ea" font-size="13.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Same ownership checks</text><rect x="556" y="296" width="5" height="5" fill="#d8b25e"/><text x="570" y="304" fill="#d5e0ea" font-size="13.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Own database file</text><rect x="556" y="323" width="5" height="5" fill="#d8b25e"/><text x="570" y="331" fill="#d5e0ea" font-size="13.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Own workspace tree</text><rect x="556" y="350" width="5" height="5" fill="#d8b25e"/><text x="570" y="358" fill="#d5e0ea" font-size="13.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Own deletion scope</text><text x="556" y="398" fill="#8093a6" font-size="13" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">No request may name alice's vault.</text><line x1="556" y1="418" x2="964" y2="418" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="556" y="446" fill="#8fd6e8" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">data/users/&lt;sha256(bob)&gt;.db</text><text x="556" y="470" fill="#8fd6e8" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">data/files/users/bob-…/</text><rect x="1008" y="186" width="536" height="320" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="1008" y="186" width="4" height="320" fill="#e58173"/><text x="1028" y="216" fill="#e58173" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">ADMIN · SUPREME OWNER</text><text x="1526" y="216" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">03</text><line x1="1024" y1="230" x2="1528" y2="230" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="1032" y="246" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Accounts, global tables, settings</text><text x="1032" y="273" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Grants and feature switches</text><text x="1032" y="300" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">No access to private vaults</text><text x="1032" y="327" fill="#d5e0ea" font-size="13" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">No plaintext member password exists</text><line x1="1032" y1="352" x2="1520" y2="352" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="1032" y="378" fill="#e58173" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">GET /api/fs/list?path=users      403</text><text x="1032" y="402" fill="#e58173" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">GET /api/users/space?username=bob  403</text><text x="1032" y="426" fill="#e58173" font-size="11.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">POST /api/users/password (other)   403</text><text x="1032" y="470" fill="#8093a6" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">The rule is enforced in every route, not in the UI.</text><rect x="56" y="550" width="736" height="276" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="56" y="550" width="4" height="276" fill="#8fd6e8"/><text x="76" y="580" fill="#8fd6e8" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">RESOLUTION AND REFUSAL · same order for every role</text><line x1="72" y1="594" x2="776" y2="594" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><rect x="80" y="594" width="22" height="22" fill="none" stroke="#8fd6e8" stroke-width="1.5"/><text x="91.0" y="609.5" fill="#8fd6e8" font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">1</text><text x="116" y="611" fill="#d5e0ea" font-size="13.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Verify Bearer token and session age.</text><rect x="80" y="632" width="22" height="22" fill="none" stroke="#8fd6e8" stroke-width="1.5"/><text x="91.0" y="647.5" fill="#8fd6e8" font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">2</text><text x="116" y="649" fill="#d5e0ea" font-size="13.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Resolve the caller's own storage root from the username.</text><rect x="80" y="670" width="22" height="22" fill="none" stroke="#8fd6e8" stroke-width="1.5"/><text x="91.0" y="685.5" fill="#8fd6e8" font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">3</text><text x="116" y="687" fill="#d5e0ea" font-size="13.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Normalize the path; reject every '..' segment.</text><rect x="80" y="708" width="22" height="22" fill="none" stroke="#8fd6e8" stroke-width="1.5"/><text x="91.0" y="723.5" fill="#8fd6e8" font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">4</text><text x="116" y="725" fill="#d5e0ea" font-size="13.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">safeJoin keeps the target inside that root.</text><rect x="80" y="746" width="22" height="22" fill="none" stroke="#8fd6e8" stroke-width="1.5"/><text x="91.0" y="761.5" fill="#8fd6e8" font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">5</text><text x="116" y="763" fill="#d5e0ea" font-size="13.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">lstat the target; refuse to follow symlinks as data.</text><line x1="80" y1="778" x2="768" y2="778" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="80" y="802" fill="#d8b25e" font-size="12.5" font-weight="600" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">A failed check returns 403 before any file handle is opened.</text><rect x="816" y="550" width="728" height="276" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="816" y="550" width="4" height="276" fill="#6fcf9f"/><text x="836" y="580" fill="#6fcf9f" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">DELETION AND LEGACY ORPHANS</text><text x="1526" y="580" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">04</text><line x1="832" y1="594" x2="1528" y2="594" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><rect x="840" y="598" width="680" height="56" fill="#060b11" stroke="#22303f" stroke-width="1"/><text x="852" y="616" fill="#6fcf9f" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">POST /api/users/delete   (admin, target account)</text><text x="852" y="637" fill="#6fcf9f" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">POST /api/me/delete       (member, own account)</text><text x="840" y="690" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Both remove the private database and the workspace.</text><text x="840" y="715" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">No other user's files are touched.</text><text x="840" y="740" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">An orphan left by an older build is moved to</text><text x="840" y="765" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">data/quarantine/&lt;random&gt;/ before a name is reused,</text><text x="840" y="790" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">so a recycled username starts with an empty space.</text><line x1="56" y1="834" x2="1544" y2="834" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="56" y="856" fill="#d8b25e" font-size="11" font-weight="600" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="1.5">TENSAINT73OS · THE SAINT KEY PROTOCOL</text><text x="1544" y="856" fill="#4f6275" font-size="11" font-weight="600" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="1.5">SHEET 02 / 07 · V1.5.0</text></svg>