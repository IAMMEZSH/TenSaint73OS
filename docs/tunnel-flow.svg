</pattern>
</defs><rect x="0" y="0" width="1600" height="950" fill="#05080d" stroke="#05080d" stroke-width="0"/><rect x="0" y="0" width="1600" height="950" fill="url(#grid)" opacity="0.55"/><line x1="28" y1="28" x2="54" y2="28" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="28" y1="28" x2="28" y2="54" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="1572" y1="28" x2="1546" y2="28" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="1572" y1="28" x2="1572" y2="54" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="28" y1="922" x2="54" y2="922" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="28" y1="922" x2="28" y2="896" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="1572" y1="922" x2="1546" y2="922" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="1572" y1="922" x2="1572" y2="896" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><line x1="56" y1="148" x2="1544" y2="148" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><line x1="56" y1="148" x2="286" y2="148" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><text x="56" y="58" fill="#d8b25e" font-size="12.5" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2.5">TENSAINT73OS  //  DOC SHEET 06</text><text x="56" y="104" fill="#eef3f8" font-size="33" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve" letter-spacing="0.6">OUTBOUND TUNNEL / NO OPEN PORT</text><text x="56" y="134" fill="#8093a6" font-size="15.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">cloudflared dials out, Cloudflare allocates a hostname, and the login page publishes it.</text><text x="1544" y="116" fill="#121c27" font-size="74" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">06</text><rect x="56" y="186" width="318" height="214" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="56" y="186" width="4" height="214" fill="#d8b25e"/><text x="76" y="216" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">ADMIN CONSOLE</text><text x="356" y="216" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">01</text><line x1="72" y1="230" x2="358" y2="230" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="80" y="248" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">Network Matrix → Tunnel Control</text><text x="80" y="274" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">Install the component</text><text x="80" y="300" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">Start · stop · refresh status</text><text x="80" y="326" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">POST /api/tunnel/*</text><line x1="378" y1="292" x2="424" y2="292" stroke="#d8b25e" stroke-width="2" stroke-linecap="butt"/><polygon points="424.0,292.0 413.0,287.4 413.0,296.6" fill="#d8b25e"/><rect x="428" y="186" width="300" height="214" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="428" y="186" width="4" height="214" fill="#8fd6e8"/><text x="448" y="216" fill="#8fd6e8" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">CLOUDFLARED PROCESS</text><text x="710" y="216" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">02</text><line x1="444" y1="230" x2="712" y2="230" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="452" y="248" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">spawned by the server</text><text x="452" y="274" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">outbound dial only</text><text x="452" y="300" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">no inbound listener</text><text x="452" y="326" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">tools/cloudflared, then PATH</text><line x1="732" y1="292" x2="778" y2="292" stroke="#8fd6e8" stroke-width="2" stroke-linecap="butt"/><polygon points="778.0,292.0 767.0,287.4 767.0,296.6" fill="#8fd6e8"/><rect x="782" y="186" width="330" height="214" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="782" y="186" width="4" height="214" fill="#8fd6e8"/><text x="802" y="216" fill="#8fd6e8" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">CLOUDFLARE EDGE</text><text x="1094" y="216" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">03</text><line x1="798" y1="230" x2="1096" y2="230" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="806" y="248" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">issues the HTTPS hostname</text><text x="806" y="274" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">TLS terminates here</text><text x="806" y="300" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">rate limits may apply</text><text x="806" y="326" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">Quick or named tunnel</text><line x1="1116" y1="292" x2="1162" y2="292" stroke="#6fcf9f" stroke-width="2" stroke-linecap="butt"/><polygon points="1162.0,292.0 1151.0,287.4 1151.0,296.6" fill="#6fcf9f"/><rect x="1166" y="186" width="378" height="214" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="1166" y="186" width="4" height="214" fill="#6fcf9f"/><text x="1186" y="216" fill="#6fcf9f" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">VIEWER · ANY DEVICE</text><text x="1526" y="216" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">04</text><line x1="1182" y1="230" x2="1528" y2="230" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="1190" y="248" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">opens the HTTPS hostname</text><text x="1190" y="274" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">sees the login page</text><text x="1190" y="300" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">needs an account</text><text x="1190" y="326" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">no port forwarding anywhere</text><rect x="56" y="436" width="720" height="250" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="56" y="436" width="4" height="250" fill="#d8b25e"/><text x="76" y="466" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">PUBLISHING PATH · READ-ONLY</text><text x="758" y="466" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">05</text><line x1="72" y1="480" x2="760" y2="480" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><rect x="80" y="480" width="20" height="20" fill="none" stroke="#d8b25e" stroke-width="1.5"/><text x="90.0" y="494.5" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">1</text><text x="112" y="496" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">cloudflared prints the assigned hostname.</text><rect x="80" y="510" width="20" height="20" fill="none" stroke="#d8b25e" stroke-width="1.5"/><text x="90.0" y="524.5" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">2</text><text x="112" y="526" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Server writes data/tunnel.url.</text><rect x="80" y="540" width="20" height="20" fill="none" stroke="#d8b25e" stroke-width="1.5"/><text x="90.0" y="554.5" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">3</text><text x="112" y="556" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Server writes data/public_url.txt.</text><rect x="80" y="570" width="20" height="20" fill="none" stroke="#d8b25e" stroke-width="1.5"/><text x="90.0" y="584.5" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">4</text><text x="112" y="586" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">The URL board records the entry.</text><rect x="80" y="600" width="20" height="20" fill="none" stroke="#d8b25e" stroke-width="1.5"/><text x="90.0" y="614.5" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">5</text><text x="112" y="616" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">GET /api/access returns the live value.</text><rect x="80" y="630" width="20" height="20" fill="none" stroke="#d8b25e" stroke-width="1.5"/><text x="90.0" y="644.5" fill="#d8b25e" font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">6</text><text x="112" y="646" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">The login page shows it with a copy button.</text><text x="80" y="668" fill="#d8b25e" font-size="11.5" font-weight="600" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">The API carries no account, file or database data.</text><rect x="800" y="436" width="744" height="280" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="800" y="436" width="4" height="280" fill="#8fd6e8"/><text x="820" y="466" fill="#8fd6e8" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">COMMAND-LINE PATH</text><text x="1526" y="466" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">06</text><line x1="816" y1="480" x2="1528" y2="480" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><rect x="824" y="478" width="696" height="58" fill="#060b11" stroke="#22303f" stroke-width="1"/><text x="836" y="496" fill="#8fd6e8" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">cd ~/TenSaint73OS</text><text x="836" y="518" fill="#8fd6e8" font-size="12.5" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">./run-online.sh</text><text x="824" y="552" fill="#8093a6" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">Ctrl+C stops the tunnel with the process.</text><text x="824" y="584" fill="#d5e0ea" font-size="12" font-weight="600" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Named tunnel with your own domain:</text><rect x="824" y="594" width="696" height="77" fill="#060b11" stroke="#22303f" stroke-width="1"/><text x="836" y="612" fill="#8fd6e8" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">cloudflared tunnel login</text><text x="836" y="633" fill="#8fd6e8" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">cloudflared tunnel create tensaint</text><text x="836" y="654" fill="#8fd6e8" font-size="12" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">TS_TUNNEL_NAME=tensaint ./run-online.sh</text><text x="824" y="706" fill="#4f6275" font-size="11" font-weight="400" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve">A restart of a Quick Tunnel allocates a different hostname.</text><rect x="56" y="710" width="1488" height="152" fill="#080e15" stroke="#22303f" stroke-width="1.5"/><rect x="56" y="710" width="4" height="152" fill="#e58173"/><text x="76" y="740" fill="#e58173" font-size="13" font-weight="700" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">FINE PRINT</text><text x="1526" y="740" fill="#4f6275" font-size="13" font-weight="700" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="2">07</text><line x1="72" y1="754" x2="1528" y2="754" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><rect x="80" y="754" width="5" height="5" fill="#e58173"/><text x="94" y="762" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Host must stay awake and online.</text><rect x="80" y="781" width="5" height="5" fill="#e58173"/><text x="94" y="789" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Quick Tunnel hostnames are temporary.</text><rect x="80" y="808" width="5" height="5" fill="#e58173"/><text x="94" y="816" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">No SLA; Cloudflare may throttle.</text><rect x="560" y="754" width="5" height="5" fill="#e58173"/><text x="574" y="762" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Anyone with the hostname reaches login.</text><rect x="560" y="781" width="5" height="5" fill="#e58173"/><text x="574" y="789" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Registration is open by default.</text><rect x="560" y="808" width="5" height="5" fill="#e58173"/><text x="574" y="816" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Disable it before sharing widely.</text><rect x="1040" y="754" width="5" height="5" fill="#e58173"/><text x="1054" y="762" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">TLS ends at Cloudflare, not at the host.</text><rect x="1040" y="781" width="5" height="5" fill="#e58173"/><text x="1054" y="789" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Never forward 7373 as plain HTTP.</text><rect x="1040" y="808" width="5" height="5" fill="#e58173"/><text x="1054" y="816" fill="#d5e0ea" font-size="12.5" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" xml:space="preserve">Best host: Windows, Linux or charged Android.</text><line x1="56" y1="904" x2="1544" y2="904" stroke="#22303f" stroke-width="1" stroke-linecap="butt"/><text x="56" y="926" fill="#d8b25e" font-size="11" font-weight="600" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="1.5">TENSAINT73OS · THE SAINT KEY PROTOCOL</text><text x="1544" y="926" fill="#4f6275" font-size="11" font-weight="600" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve" letter-spacing="1.5">SHEET 06 / 07 · V1.5.0</text></svg>